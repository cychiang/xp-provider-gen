# Direct dependencies pinned in generated providers' go.mod.
#
# This is the single source of truth for the framework/Kubernetes versions a
# generated provider targets. It is rendered into the provider's go.mod at init
# and applied to existing providers by `xp-provider-gen update`.
#
# Tracked upstream by Renovate via a custom manager (see renovate.json), so each
# entry gets its own bump PR against this repository, gated by CI + e2e.
dependencies:
  - module: github.com/alecthomas/kingpin/v2
    version: v2.4.0
  - module: github.com/crossplane/crossplane-runtime/v2
    version: v2.3.3
  - module: github.com/crossplane/crossplane/apis/v2
    version: v2.3.4
  - module: github.com/google/go-cmp
    version: v0.7.0
  - module: google.golang.org/grpc
    version: v1.83.0
  - module: k8s.io/apimachinery
    version: v0.36.3
  - module: k8s.io/client-go
    version: v0.36.3
  - module: sigs.k8s.io/controller-runtime
    version: v0.24.1

# Additional direct dependencies for upjet-flavored providers. Rendered on top
# of the shared set above when `init --upjet` scaffolds a project.
upjet_dependencies:
  - module: github.com/crossplane/upjet/v2
    version: v2.4.1-0.20260728103920-4f6e6e10dff2
  - module: github.com/crossplane/crossplane-tools
    version: v0.0.0-20260715161912-60e57f817ad1
  - module: github.com/pkg/errors
    version: v0.9.1
  - module: dario.cat/mergo
    version: v1.0.2
  - module: k8s.io/api
    version: v0.36.3
  - module: k8s.io/apiextensions-apiserver
    version: v0.36.3
  - module: sigs.k8s.io/controller-tools
    version: v0.20.1
