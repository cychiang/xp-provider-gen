name: Build

permissions:
  contents: read

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Download dependencies
      run: go mod download

    - name: Build binary
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        VERSION=${GITHUB_SHA::7}
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        fi

        BINARY_NAME=xp-provider-gen
        if [ "${{ matrix.goos }}" = "windows" ]; then
          BINARY_NAME="${BINARY_NAME}.exe"
        fi

        OUTPUT_PATH="dist/${BINARY_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}"
        if [ "${{ matrix.goos }}" = "windows" ]; then
          OUTPUT_PATH="${OUTPUT_PATH}.exe"
        fi

        mkdir -p dist

        go build \
          -ldflags "-X github.com/cychiang/xp-provider-gen/pkg/version.Version=${VERSION} -X github.com/cychiang/xp-provider-gen/pkg/version.GitCommit=${GITHUB_SHA} -X github.com/cychiang/xp-provider-gen/pkg/version.BuildDate=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          -trimpath \
          -o "${OUTPUT_PATH}" \
          ./cmd/xp-provider-gen

        # Create checksums
        cd dist
        sha256sum "${BINARY_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}$([ "${{ matrix.goos }}" = "windows" ] && echo ".exe" || echo "")" > "${BINARY_NAME}_${{ matrix.goos }}_${{ matrix.goarch }}.sha256"

    - name: Upload build artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
        path: dist/*
        retention-days: 30

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Determine version
      id: version
      run: |
        VERSION=${GITHUB_SHA::7}
        if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
        fi
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

    # Builds the repository's Dockerfile — the same one release.yml publishes —
    # so the image CI validates is the image users get. This job previously
    # generated its own Dockerfile inline, which had drifted to an older Alpine
    # base than the committed one.
    - name: Build Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        push: false
        load: true
        tags: xp-provider-gen:${{ steps.version.outputs.version }}
        build-args: |
          VERSION=${{ steps.version.outputs.version }}
          COMMIT=${{ github.sha }}

    - name: Smoke-test the image
      run: docker run --rm xp-provider-gen:${{ steps.version.outputs.version }} version