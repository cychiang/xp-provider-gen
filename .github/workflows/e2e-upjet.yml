name: E2E Upjet

permissions:
  contents: read

# `make e2e-upjet` (the `test/e2e` stage harness) needs network (Terraform download,
# Terraform Registry schema read, provider docs scrape) and takes several
# minutes, so it does not run on every PR. It runs on a weekly schedule, on PRs
# that touch the upjet flavor's templates or the harness that exercises it, and
# on demand. Its upgrade job runs on the schedule and on demand only.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch: {}
  pull_request:
    branches: [ main, develop ]
    paths:
      # Anything that can change what an upjet scaffold contains, or how this
      # suite exercises it. pkg/versions holds upjet_dependencies, and the
      # shared generators and plugin logic render into upjet scaffolds too —
      # leaving them out meant a PR bumping upjet's own dependency never ran
      # this job.
      - 'pkg/templates/upjet/**'
      - 'pkg/templates/generators/**'
      - 'pkg/templates/loader.go'
      - 'pkg/versions/**'
      - 'pkg/plugins/crossplane/v2/**'
      - 'test/e2e/**'
      - 'Makefile'
      - '.github/workflows/e2e-upjet.yml'

jobs:
  e2e-upjet:
    name: E2E (upjet)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Configure git identity for generated commits
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    # Full mode runs the whole scaffold -> configure -> generate -> build ->
    # run pipeline against the real hashicorp/kubernetes Terraform provider,
    # then deploys the provider to a kind cluster and reconciles a ConfigMap
    # through it. It exits 1 before the first stage if Docker is missing. kind
    # itself is downloaded by the scaffolded project's own Makefile
    # (KIND_VERSION is pinned there), so this runner needs only the Docker
    # daemon GitHub's ubuntu-latest runners already provide.
    - name: Run full upjet E2E stages
      run: make e2e-upjet E2E_ARGS="--logs=${{ runner.temp }}/e2e-logs --report=${{ runner.temp }}/e2e-logs/report.json"

    - name: Upload per-stage logs and report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: e2e-upjet-logs
        path: ${{ runner.temp }}/e2e-logs

  # Not on pull requests: it needs the published release's own binary, and the
  # newest release does not change with a PR.
  e2e-upjet-upgrade:
    name: E2E (upjet, upgrade from the newest release)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Configure git identity for generated commits
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    # The newest published release's own binary (--from=latest, which gh
    # resolves) scaffolds an upjet provider, this checkout's build updates it,
    # and the result is generated, deployed and reconciled on a kind cluster.
    # report.json in the artifact holds the stage times and the upgrade counts.
    - name: Run upjet upgrade E2E from the newest release
      env:
        GH_TOKEN: ${{ github.token }}
      run: make e2e-upjet E2E_ARGS="--from=latest --logs=${{ runner.temp }}/e2e-logs --report=${{ runner.temp }}/e2e-logs/report.json"

    - name: Upload per-stage logs and report
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: e2e-upjet-upgrade-logs
        path: ${{ runner.temp }}/e2e-logs
