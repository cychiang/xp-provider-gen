name: E2E Native (full) & Upgrade

permissions:
  contents: read

# The fast native e2e in test.yml runs on every PR without its cluster stages
# (kind + Crossplane + a real external object), so PRs stay fast and the run
# ends in VERDICT PARTIAL. Those stages — a generated native provider actually
# deploying to a real cluster and reconciling — and the upgrade of a provider
# scaffolded by the newest published release (the check that protects provider
# authors from a breaking generator bump) are both expensive and both valuable,
# so they run here instead. The full run is on a weekly schedule, on demand, and
# on every PR except one that touches only docs (paths-ignore): a path allow-list
# silently skips the PRs whose dependency it forgot, so this lists what is safe
# to skip, not what to run. The upgrade run is on the schedule and on demand only.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch: {}
  pull_request:
    branches: [ main, develop ]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'

jobs:
  e2e-native-full:
    name: E2E (native, full)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Configure git identity for generated commits
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    # Full mode exits 1 before the first stage if Docker is missing. kind
    # itself is downloaded by the generated project's own Makefile
    # (KIND_VERSION is pinned there), so this runner needs only the Docker
    # daemon GitHub's ubuntu-latest runners already provide.
    - name: Run full native E2E stages
      run: make e2e-native E2E_ARGS="--logs=${{ runner.temp }}/e2e-logs --report=${{ runner.temp }}/e2e-logs/report.json"

    - name: Upload per-stage logs and report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: e2e-native-full-logs
        path: ${{ runner.temp }}/e2e-logs

  # Not on pull requests: it needs the published release's own binary, and the
  # newest release does not change with a PR.
  e2e-upgrade:
    name: E2E (upgrade from the newest release)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Configure git identity for generated commits
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    # Scaffolds a provider with the newest published release's own binary
    # (--from=latest, which gh resolves), writes user logic into it, updates it
    # with this checkout's build, and asserts the user's logic survives and the
    # result still generates, lints, builds and reconciles on a kind cluster.
    # report.json in the artifact holds the stage times and the upgrade counts.
    - name: Run upgrade E2E from the newest release
      env:
        GH_TOKEN: ${{ github.token }}
      run: make e2e-native E2E_ARGS="--from=latest --logs=${{ runner.temp }}/e2e-logs --report=${{ runner.temp }}/e2e-logs/report.json"

    - name: Upload per-stage logs and report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: e2e-upgrade-logs
        path: ${{ runner.temp }}/e2e-logs
