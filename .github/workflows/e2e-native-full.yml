name: E2E Native (full) & Upgrade

permissions:
  contents: read

# The fast native e2e in test.yml runs on every PR without its cluster stages
# (kind + Crossplane + a real external object), so PRs stay fast and the run
# ends in VERDICT PARTIAL. Those stages — a generated native provider actually
# deploying to a real cluster and reconciling — and the upgrade of a provider
# scaffolded by each published release (the check that protects provider
# authors from a breaking generator bump) are both
# expensive and both valuable, so they run here instead: on a weekly schedule, on demand,
# and on PRs that touch the generator surfaces these checks actually exercise
# (so a PR that changes that surface is verified before merge, not just
# after, without slowing down unrelated PRs).
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch: {}
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'pkg/plugins/crossplane/v2/**'
      - 'pkg/templates/files/**'
      - 'pkg/templates/generators/**'
      - 'pkg/templates/loader.go'
      - 'pkg/versions/**'
      - 'test/e2e/**'
      - 'Makefile'
      - '.github/workflows/e2e-native-full.yml'

jobs:
  e2e-native-full:
    name: E2E (native, full)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Configure git identity for generated commits
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    # Full mode exits 1 before the first stage if Docker is missing. kind
    # itself is downloaded by the generated project's own Makefile
    # (KIND_VERSION is pinned there), so this runner needs only the Docker
    # daemon GitHub's ubuntu-latest runners already provide.
    - name: Run full native E2E stages
      run: make e2e-native E2E_ARGS="--logs=${{ runner.temp }}/e2e-logs"

    - name: Upload per-stage logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: e2e-native-full-logs
        path: ${{ runner.temp }}/e2e-logs

  e2e-upgrade:
    name: E2E (upgrade from ${{ matrix.from }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        from: [v0.1.0, v0.2.0, v0.3.0]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod

    - name: Configure git identity for generated commits
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"

    # Scaffolds a provider with the published release's own binary, writes
    # user logic into it, updates it with this checkout's build, and asserts
    # the user's logic survives and the result still generates, lints, builds
    # and reconciles on a kind cluster. gh lists and downloads the release.
    - name: Run upgrade E2E from ${{ matrix.from }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: make e2e-native E2E_ARGS="--from=${{ matrix.from }} --logs=${{ runner.temp }}/e2e-logs"

    - name: Upload per-stage logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: e2e-upgrade-${{ matrix.from }}-logs
        path: ${{ runner.temp }}/e2e-logs
