name: Feature request
description: Suggest a change to the generator or to the providers it scaffolds.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and what stops you today.
    validations:
      required: true
  - type: dropdown
    id: flavor
    attributes:
      label: Flavor
      options:
        - native
        - upjet
        - Both
        - Not about a flavor (CLI, docs, releases)
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The change you have in mind, if you have one.
